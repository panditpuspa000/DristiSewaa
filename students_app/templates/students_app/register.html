<body>
<div class="reg-container">
    <div class="form-section">
        <div class="logo-area">
            <img src="{% static 'images/logo.png' %}" alt="DristiSewa Logo">
        </div>
        <p class="tagline">Register to apply to your dream universities.</p>
        
        {% if messages %}
            {% for message in messages %}
                <p class="msg {{ message.tags }}">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form id="registerForm" action="{% url 'students:register' %}" method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>First Name</label>
                <input type="text" name="first_name" required>
            </div>
            <div class="input-group">
                <label>Last Name</label>
                <input type="text" name="last_name" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="register-btn">Register Account</button>
        </form>
        <p class="login-link">
            Already have an account? <a href="{% url 'students:login' %}">Login Here</a>
        </p>
    </div>
</div>
<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    let password = document.getElementById("password");
    let confirm = document.getElementById("confirm_password");
    password.classList.remove("error");
    confirm.classList.remove("error");
    if (password.value !== confirm.value) {
        e.preventDefault();
        password.classList.add("error");
        confirm.classList.add("error");
        alert("Passwords do not match!");
    }
});
</script>
</body>
