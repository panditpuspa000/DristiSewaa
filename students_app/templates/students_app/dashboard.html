{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - DristiSewa</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            display:flex;
            background:#f0f2f5;
            height:100vh;
            overflow:hidden;
        }

        .sidebar{
            width:280px;
            background:linear-gradient(180deg,#1e27cc 0%, #151b8d 100%);
            color:white;
            display:flex;
            flex-direction:column;
        }

        .user-profile{
            padding:40px 20px;
            text-align:center;
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        .nav-links{
            flex:1;
            padding:20px 0;
        }

        .nav-item{
            padding:15px 30px;
            display:flex;
            align-items:center;
            text-decoration:none;
            color:rgba(255,255,255,0.8);
        }

        .nav-item.active{
            background:#00d2ff;
            color:white;
        }

        .logout-btn{
            background:#ffb800;
            color:#000;
            padding:18px;
            text-align:center;
            text-decoration:none;
            font-weight:700;
        }

        .main-content{
            flex:1;
            overflow-y:auto;
        }

        .top-header{
            background:#fff;
            padding:15px 40px;
            display:flex;
            justify-content:flex-end;
            align-items:center;
        }

        .form-card{
            background:white;
            margin:30px auto;
            width:92%;
            max-width:1000px;
            padding:40px;
            border-radius:12px;
        }

        .form-title{
            font-size:22px;
            margin-bottom:30px;
            color:#1e27cc;
        }

        .section-header{
            margin:25px 0 15px;
            font-weight:600;
            color:#444;
            border-bottom:2px solid #eee;
            padding-bottom:8px;
        }

        .grid-row{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-bottom: 15px;
        }

        .field-group{
            display:flex;
            flex-direction:column;
        }

        .field-group label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        input, select{
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #1e27cc;
        }

        .error{
            border:2px solid red !important;
        }

        .footer-action{
            margin-top:40px;
            display:flex;
            justify-content:flex-end;
        }

        .next-btn{
            width:55px;
            height:55px;
            border-radius:50%;
            border:none;
            background:#1e27cc;
            color:white;
            font-size:20px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition: background 0.2s ease;
        }

        .next-btn:hover {
            background: #151b8d;
        }

        .error-msg{
            color:red;
            font-size:13px;
            margin-top:10px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="user-profile">
        <i class="fa-solid fa-circle-user" style="font-size:60px;"></i>
        <p style="margin-top:10px; font-weight:500;">Student Dashboard</p>
    </div>

    <div class="nav-links">
        <a href="{% url 'students:dashboard' %}" class="nav-item active">
            <i class="fa-solid fa-house" style="margin-right:10px;"></i> Home
        </a>
        <a href="{% url 'students:upload_docs' %}" class="nav-item">
            <i class="fa-solid fa-cloud-arrow-up" style="margin-right:10px;"></i> Upload Documents
        </a>
        <a href="{% url 'students:app_status' %}" class="nav-item">
            <i class="fa-solid fa-clock" style="margin-right:10px;"></i> Status
        </a>
    </div>

    <a href="{% url 'students:logout' %}" class="logout-btn">
        <i class="fa-solid fa-power-off" style="margin-right:5px;"></i> Logout
    </a>
</div>

<div class="main-content">

    <div class="top-header">
        <div>
            <strong>Hi, {{ request.user.first_name }}!</strong><br>
            <small>{{ request.user.email }}</small>
        </div>
    </div>

    <div class="form-card">
        <h2 class="form-title">Application Form</h2>

        <form id="appForm" method="POST" action="{% url 'students:dashboard' %}">
            {% csrf_token %}

            <div class="section-header">Personal Information</div>

            <div class="grid-row">
                <div class="field-group">
                    <label>First Name</label>
                    <input type="text" value="{{ request.user.first_name }}" readonly>
                </div>

                <div class="field-group">
                    <label>Last Name</label>
                    <input type="text" value="{{ request.user.last_name }}" readonly>
                </div>
            </div>

            <div class="grid-row">
                <div class="field-group">
                    <label>Email</label>
                    <input type="text" value="{{ request.user.email }}" readonly>
                </div>

                <div class="field-group">
                    <label>Date of Birth</label>
                    <input type="date" name="date_of_birth" value="{{ profile.date_of_birth|date:'Y-m-d' }}">
                </div>
            </div>

            <div class="section-header">Academic</div>

            <div class="grid-row">
                <div class="field-group">
                    <label>College Name</label>
                    <input type="text" name="college_name" value="{{ profile.college_name|default:'' }}">
                </div>

                <div class="field-group">
                    <label>Passed Year (1990-2027)</label>
                    <input type="number" id="year" name="passed_year" min="1990" max="2027" value="{{ profile.passed_year|default:'' }}">
                </div>

                <div class="field-group">
                    <label>GPA (0.0 - 4.0)</label>
                    <input type="number" id="gpa" name="gpa" step="0.01" min="0" max="4" value="{{ profile.gpa|default:'' }}">
                </div>
            </div>

            <div class="section-header">English</div>

            <div class="grid-row">
                <div class="field-group">
                    <label>Test Type</label>
                    <select id="testType" name="test_type">
                        <option value="">Select</option>
                        <option value="IELTS" {% if profile.test_type == 'IELTS' %}selected{% endif %}>IELTS</option>
                        <option value="PTE" {% if profile.test_type == 'PTE' %}selected{% endif %}>PTE</option>
                        <option value="TOEFL" {% if profile.test_type == 'TOEFL' %}selected{% endif %}>TOEFL</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Score</label>
                    <input type="number" id="score" name="test_score" step="0.01" value="{{ profile.test_score|default:'' }}">
                </div>

                <div class="field-group">
                    <label>Preferred Country</label>
                    <select name="preferred_country">
                        <option value="UK" {% if profile.preferred_country == 'UK' %}selected{% endif %}>UK</option>
                        <option value="USA" {% if profile.preferred_country == 'USA' %}selected{% endif %}>USA</option>
                        <option value="Canada" {% if profile.preferred_country == 'Canada' %}selected{% endif %}>Canada</option>
                        <option value="Australia" {% if profile.preferred_country == 'Australia' %}selected{% endif %}>Australia</option>
                    </select>
                </div>
            </div>

            <p id="error" class="error-msg"></p>

            <div class="footer-action">
                <button type="submit" class="next-btn">
                    <i class="fa-solid fa-angles-right"></i>
                </button>
            </div>

        </form>
    </div>
</div>

<script>
// ✅ Fixed: Attached validation check intercept straight to form onsubmit listener event
document.getElementById("appForm").onsubmit = function(event) {
    let year = document.getElementById("year");
    let gpa = document.getElementById("gpa");
    let testType = document.getElementById("testType");
    let score = document.getElementById("score");
    let error = document.getElementById("error");

    error.innerText = "";

    let y = parseInt(year.value);
    let g = parseFloat(gpa.value);
    let s = parseFloat(score.value);
    let t = testType.value;

    // YEAR CHECK
    if(year.value && (y < 1990 || y > 2027)){
        error.innerText = "Passed year must be between 1990 and 2027";
        event.preventDefault(); // Blocks invalid form data dispatch pipelines
        return false;
    }

    // GPA CHECK
    if(gpa.value && (g < 0 || g > 4)){
        error.innerText = "GPA must be between 0.0 and 4.0";
        event.preventDefault();
        return false;
    }

    // TEST TYPE VALIDATION
    if(t === ""){
        error.innerText = "Select English test type";
        event.preventDefault();
        return false;
    }

    // SCORE VALIDATION
    if(score.value) {
        if(t === "IELTS" && (s < 0 || s > 9)){
            error.innerText = "IELTS score must be 0 - 9";
            event.preventDefault();
            return false;
        }

        if(t === "PTE" && (s < 10 || s > 90)){
            error.innerText = "PTE score must be 10 - 90";
            event.preventDefault();
            return false;
        }

        if(t === "TOEFL" && (s < 0 || s > 120)){
            error.innerText = "TOEFL score must be 0 - 120";
            event.preventDefault();
            return false;
        }
    } else {
        error.innerText = "Please enter your test score";
        event.preventDefault();
        return false;
    }
    
    // Form proceeds naturally to perform native POST transmission back to views.py
};
</script>

</body>
</html>
