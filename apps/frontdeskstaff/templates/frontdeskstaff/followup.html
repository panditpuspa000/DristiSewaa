{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Followup Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fe; }
        .sidebar-active { background-color: #0ea5e9; }
        .status-select {
            appearance: none;
            background-color: #e2e8f0;
            border-radius: 5px;
            padding: 4px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div class="flex min-h-screen">
        <div class="w-64 bg-[#3f39c5] text-white flex flex-col justify-between shrink-0">
            <div>
                <div class="p-6 flex items-center gap-3 border-b border-indigo-700/50">
                    <img src="{% static 'images/home.png' %}" alt="Logo" class="w-8 h-8 object-contain">
                    <span class="font-bold text-lg tracking-wide">Dashboard</span>
                </div>
            <nav class="mt-4">
    <a href="{% url 'frontdesk_dashboard' %}" class="flex items-center px-6 py-4 hover:bg-indigo-700 transition-all">
        <i class="fas fa-user-graduate mr-3 w-5"></i> Student Management
    </a>
    <a href="{% url 'followup_management' %}" class="flex items-center px-6 py-4 sidebar-active transition-all">
        <i class="fas fa-tasks mr-3 w-5"></i> Followup Management
    </a>
    <a href="#" class="flex items-center px-6 py-4 hover:bg-indigo-700 transition-all">
        <i class="fas fa-archive mr-3 w-5"></i> Archived Students
    </a>
</nav>
            </div>
            
            <div class="bg-orange-400 p-4 flex items-center justify-center gap-3 cursor-pointer font-bold hover:bg-orange-500 transition-all">
                <i class="fas fa-sign-out-alt"></i> Logout
            </div>
        </div>

        <div class="flex-1 p-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div class="flex flex-wrap gap-4 flex-1">
                    <div class="bg-[#bfdbfe]/60 p-4 rounded-2xl flex items-center min-w-[220px] border border-[#bfdbfe]">
                        <div class="bg-white p-4 rounded-xl mr-4 text-[#2563eb] flex items-center justify-center shadow-sm w-14 h-14">
                            <i class="fas fa-users text-xl"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">Total Students</p>
                            <p class="text-2xl font-black text-black">50</p>
                        </div>
                    </div>
                    <div class="bg-[#fef08a]/70 p-4 rounded-2xl flex items-center min-w-[220px] border border-[#fef08a]">
                        <div class="bg-white p-4 rounded-xl mr-4 text-[#ea580c] flex items-center justify-center shadow-sm w-14 h-14">
                            <i class="fas fa-list-ul text-xl"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">Pending Forms</p>
                            <p class="text-2xl font-black text-black">10</p>
                        </div>
                    </div>
                    <div class="bg-[#fbcfe8]/60 p-4 rounded-2xl flex items-center min-w-[220px] border border-[#fbcfe8]">
                        <div class="bg-white p-4 rounded-xl mr-4 text-[#db2777] flex items-center justify-center shadow-sm w-14 h-14">
                            <i class="fas fa-file-alt text-xl"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">Archived</p>
                            <p class="text-2xl font-black text-black">5</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3 px-4 py-2">
                    <div class="text-right">
                        <p class="font-bold text-[#0f172a] text-base leading-tight">Priya Thapa</p>
                        <p class="text-xs text-gray-400 font-medium">Front desk</p>
                    </div>
                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-500 border border-gray-300 shadow-sm">
                        <i class="fas fa-user text-lg"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="p-5 border-b flex flex-wrap justify-between items-center gap-4">
                    <h2 class="font-bold text-gray-700 text-lg">Followup Management</h2>
                    
                    <div class="flex gap-4 items-center">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                            <input type="text" id="studentSearch" onkeyup="filterData()" placeholder="Search name or phone..." 
                                   class="pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg w-64 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                        </div>

                        <div class="flex items-center gap-2">
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Sort by:</label>
                            <select id="sortFilter" onchange="filterData()" class="bg-gray-50 border border-gray-200 text-sm p-2 rounded-lg outline-none cursor-pointer font-medium text-gray-700">
                                <option value="all">All Records</option>
                                <option value="today">Today's Followup</option>
                                <option value="upcoming">Upcoming (Tomorrow)</option>
                                <option value="overdue">Overdue</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm" id="studentTable">
                        <thead class="bg-gray-50 border-b-2 border-blue-500 text-gray-500 uppercase text-[11px] tracking-wider">
                            <tr>
                                <th class="p-4"><input type="checkbox" class="rounded"></th>
                                <th class="p-4 font-bold">Name</th>
                                <th class="p-4 font-bold">Email</th>
                                <th class="p-4 font-bold">Phone</th>
                                <th class="p-4 font-bold">Country</th>
                                <th class="p-4 font-bold text-center">Status</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-600 divide-y divide-gray-100" id="tableBody">
                            </tbody>
                    </table>
                </div>

                <div class="p-4 flex justify-between items-center text-xs text-gray-400 border-t bg-gray-50">
                    <p id="counter">Showing 0 entries</p>
                    <div class="flex gap-1">
                        <button class="px-3 py-1 bg-white border border-gray-200 rounded hover:bg-gray-100">Prev</button>
                        <button class="px-3 py-1 bg-blue-600 text-white rounded shadow-sm">1</button>
                        <button class="px-3 py-1 bg-white border border-gray-200 rounded hover:bg-gray-100">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        const tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate() + 1);
        const tomorrow = tomorrowDate.toISOString().split('T')[0];
        const yesterdayDate = new Date(); yesterdayDate.setDate(yesterdayDate.getDate() - 1);
        const yesterday = yesterdayDate.toISOString().split('T')[0];

        const students = [
            { name: "Sujata Thapa", email: "sujatathapa05@gmail.com", phone: "9815145982", country: "Nepal", followup: today },
            { name: "Anita B.K", email: "anitaa56@gmail.com", phone: "9874512365", country: "Australia", followup: tomorrow },
            { name: "Nikita Thapa", email: "nikitathapa8@gmail.com", phone: "9815478965", country: "Canada", followup: yesterday },
            { name: "Aastha Ojha", email: "aasthaojhaa11@gmail.com", phone: "9805489615", country: "USA", followup: today },
            { name: "Samip Basnet", email: "basnetsamip45@gmail.com", phone: "9895102456", country: "UK", followup: yesterday },
            { name: "Rejina Rana", email: "ranarejina22@gmail.com", phone: "9815678420", country: "Japan", followup: tomorrow },
            { name: "Binita Ale", email: "binitaale09@gmail.com", phone: "9785614821", country: "Nepal", followup: today },
            { name: "Salina Dura", email: "salinadura22@gmail.com", phone: "9801148795", country: "Australia", followup: yesterday }
        ];

        function filterData() {
            const query = document.getElementById('studentSearch').value.toLowerCase();
            const filter = document.getElementById('sortFilter').value;
            const container = document.getElementById('tableBody');
            
            let filtered = students.filter(s => {
                const searchMatch = s.name.toLowerCase().includes(query) || s.phone.includes(query);
                let filterMatch = true;
                if (filter === 'today') filterMatch = (s.followup === today);
                if (filter === 'upcoming') filterMatch = (s.followup === tomorrow);
                if (filter === 'overdue') filterMatch = (s.followup < today);
                
                return searchMatch && filterMatch;
            });

            container.innerHTML = filtered.map(s => `
                <tr class="hover:bg-blue-50 transition-all group">
                    <td class="p-4"><input type="checkbox" class="rounded border-gray-300"></td>
                    <td class="p-4 font-semibold text-blue-600 cursor-pointer group-hover:underline" onclick="alert('Student: ${s.name}')">${s.name}</td>
                    <td class="p-4 text-gray-500">${s.email}</td>
                    <td class="p-4 font-mono font-medium">${s.phone}</td>
                    <td class="p-4"><span class="bg-gray-100 px-2 py-1 rounded text-xs">${s.country}</span></td>
                    <td class="p-4 text-center">
                        <select class="status-select outline-none focus:ring-1 focus:ring-blue-400">
                            <option value="" selected disabled>Update Status</option>
                            <option>Interested</option>
                            <option>Pending</option>
                            <option>Completed</option>
                            <option>Not Interested</option>
                        </select>
                    </td>
                </tr>
            `).join('');

            document.getElementById('counter').innerText = `Showing ${filtered.length} of ${students.length} entries`;
        }

        window.onload = filterData;
    </script>
</body>
</html>
