{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DristiSewa</title>
    <!-- Tailwind & FontAwesome for your base layout structure -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-blue: #0b66e4; }
        .bg-primary-blue { background-color: var(--primary-blue); }
        .text-primary-blue { color: var(--primary-blue); }
    </style>
</head>
<body class="bg-gray-50 font-sans flex min-h-screen">

    <!-- Sidebar wrapper configured specifically for the Admin -->
    <aside class="w-64 bg-slate-900 text-slate-200 flex flex-col p-4 sticky top-0 h-screen shrink-0">
        <div class="flex flex-col flex-1">
            <!-- Branding Header -->
            <div class="flex items-center gap-3 px-2 py-4 mb-6 border-b border-slate-800">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white tracking-wide text-sm">DristiSewa</h2>
                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded font-mono uppercase tracking-wider">Admin Control</span>
                </div>
            </div>

            <!-- Navigation Links pointing to your Admin routes -->
            <nav class="space-y-1">
                <a href="{% url 'accounts:admin_dashboard' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl {% if request.resolver_match.url_name == 'admin_dashboard' %} bg-slate-800 text-white {% else %} text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 {% endif %}">
                    <i class="fa-solid fa-chart-pie text-lg"></i> Branch Overview
                </a>
                
                <a href="{% url 'accounts:branch_staff' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl {% if request.resolver_match.url_name == 'branch_staff' %} bg-slate-800 text-white {% else %} text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 {% endif %}">
                    <i class="fa-solid fa-id-card-clip text-lg"></i> Branch & Staff
                </a>
                
                <a href="{% url 'accounts:student_management' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl {% if request.resolver_match.url_name == 'student_management' %} bg-slate-800 text-white {% else %} text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 {% endif %}">
                    <i class="fa-solid fa-graduation-cap text-lg"></i> Students Registry
                </a>
            </nav>
        </div>

        <!-- Footer / Session Close Actions -->
        <div class="pt-4 border-t border-slate-800">
            <a href="{% url 'accounts:user_logout' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:bg-red-950/30 hover:text-red-400 rounded-xl transition">
                <i class="fa-solid fa-right-from-bracket text-lg"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Workspace Frame: Your untouched Figma Prototype loads right inside here -->
    <main class="flex-1 p-10 overflow-y-auto">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
