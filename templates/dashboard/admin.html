{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DristiSewa - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-blue: #0b66e4; }
        .bg-primary-blue { background-color: var(--primary-blue); }
        .text-primary-blue { color: var(--primary-blue); }
    </style>
</head>
<body class="bg-gray-50 font-sans flex min-h-screen">

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col p-4 sticky top-0 h-screen">
        <div class="flex flex-col">
            <div class="flex flex-col items-center justify-center px-2 py-2 mb-4 border-b border-gray-100">
                <div class="h-40 w-full flex items-center justify-center overflow-hidden">
                    <img src="{% static 'images/logo.png' %}" 
                         alt="DristiSewa Logo" 
                         class="h-40 w-auto max-w-full object-contain block">
                </div>
            </div>

            <nav class="space-y-1">
                <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl {% if request.resolver_match.url_name == 'admin_dashboard' %} bg-blue-50 text-primary-blue {% else %} text-gray-600 hover:bg-gray-50 {% endif %}">
                    <i class="fa-solid fa-chart-pie text-lg"></i> Dashboard
                </a>
                
                <a href="{% url 'branch_staff' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl {% if request.resolver_match.url_name == 'branch_staff' %} bg-blue-50 text-primary-blue {% else %} text-gray-600 hover:bg-gray-50 {% endif %}">
                    <i class="fa-solid fa-id-card-clip text-lg"></i> Branch & Staff
                </a>
                
                <a href="{% url 'student_management' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl {% if request.resolver_match.url_name == 'student_management' %} bg-blue-50 text-primary-blue {% else %} text-gray-600 hover:bg-gray-50 {% endif %}">
                    <i class="fa-solid fa-graduation-cap text-lg"></i> Students
                </a>
            </nav>
        </div>

        <div class="mt-auto pt-4">
            <a href="{% url 'logout' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition">
                <i class="fa-solid fa-right-from-bracket text-lg"></i> Logout
            </a>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
