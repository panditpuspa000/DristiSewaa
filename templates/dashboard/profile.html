<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management UI - Complete Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        
        .active-tab { background-color: #64748b !important; color: white !important; }
        .inactive-tab { background-color: #dbeafe !important; color: black !important; }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .new-row { animation: fadeInDown 0.4s ease-out; }

        /* Modal Background Blur Overlay */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">

    <div class="w-full px-6 py-4 flex items-center justify-between bg-white border-b border-gray-100 mb-4">
        <a href="{% url 'frontdesk_dashboard' %}" class="text-blue-600 font-bold hover:text-blue-800 flex items-center gap-2 text-sm">
            <i class="fas fa-arrow-left border p-1.5 rounded bg-blue-50"></i> 
            <span>Back to Dashboard</span> 
        </a>
    </div>

    <div class="w-full px-6 flex flex-col md:flex-row gap-6 pb-8 items-stretch">
        
        <div class="w-full md:w-1/4 bg-white p-5 rounded-lg border border-gray-200 shadow-sm text-center flex flex-col justify-between min-h-[580px]">
            <div>
                <div class="mb-3 flex justify-center">
                    <div class="w-24 h-24 bg-black rounded-full flex items-center justify-center text-white shadow-sm">
                        <i class="fas fa-user text-4xl"></i>
                    </div>
                </div>
                <h2 id="displayFullName" class="text-blue-600 text-lg font-bold mb-1.5">Sujata Thapa</h2>
                <p class="text-blue-800 font-medium mb-0.5 text-xs">Phone : <span id="displayPhone" class="text-gray-600 font-normal">9815145982</span></p>
                <p class="text-blue-800 font-medium mb-5 text-xs">Email : <span id="displayEmail" class="text-gray-600 font-normal">sujatathapa05@gmail.com</span></p>
                
                <button onclick="toggleEditProfileModal(true)" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition mb-3 shadow-sm text-xs tracking-wide">
                    Edit Profile
                </button>
                
                <button class="w-full bg-red-400 text-white py-2 rounded-md font-semibold hover:bg-red-500 transition mb-4 shadow-sm text-xs tracking-wide">
                    Archive Student
                </button>
            </div>

            <div class="text-left mt-4 pt-4 border-t border-gray-150">
                <label class="text-blue-600 font-bold block mb-1.5 text-xs">Assign User :</label>
                <div class="relative mb-3">
                    <select class="w-full border border-gray-300 p-2 rounded appearance-none focus:outline-none text-xs bg-white cursor-pointer text-gray-700">
                        <option>Sushil Regmi</option>
                        <option>Admin User</option>
                    </select>
                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
                        <i class="fas fa-caret-down text-gray-500 text-xs"></i>
                    </div>
                </div>
                <button class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition shadow-sm text-xs tracking-wide">
                    Assign User
                </button>
            </div>
        </div>

        <div class="flex-1 flex flex-col">
            <div class="flex">
                <button id="docTab" onclick="switchTab('document')" class="flex-1 active-tab py-3 rounded-tl-md font-bold text-sm shadow-sm transition-all">Document Upload</button>
                <button id="remTab" onclick="switchTab('remarks')" class="flex-1 inactive-tab py-3 rounded-tr-md font-bold text-sm shadow-sm transition-all">Remarks</button>
            </div>

            <div class="bg-white border border-gray-200 rounded-b-lg p-6 shadow-sm min-h-[520px] flex flex-col justify-between relative">
                
                <div id="documentContent" class="w-full">
                    <div class="flex justify-between border-b border-gray-200 pb-2 mb-4 text-[11px] font-bold text-gray-400 uppercase tracking-wider">
                        <span>Document</span>
                        <span>Update Status</span>
                    </div>
                    
                    <div id="fileList" class="space-y-3 mb-6">
                        <div class="flex items-center justify-between border border-gray-200 p-3 rounded bg-white hover:bg-gray-50 transition">
                            <div class="flex items-center gap-3">
                                <i class="fas fa-file-pdf text-red-500 text-lg"></i>
                                <span class="text-xs text-gray-700 font-medium">Passport_All Pages.pdf</span>
                            </div>
                            <select class="text-[11px] border border-gray-300 rounded p-1.5 text-orange-600 font-bold bg-orange-50 outline-none cursor-pointer focus:border-orange-400">
                                <option class="text-orange-600 font-bold">⏳ Under Review</option>
                                <option class="text-green-600 font-bold">✅ Approve</option>
                                <option class="text-red-600 font-bold">❌ Reject</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between border border-gray-200 p-3 rounded bg-white hover:bg-gray-50 transition">
                            <div class="flex items-center gap-3">
                                <i class="fas fa-file-image text-blue-500 text-lg"></i>
                                <span class="text-xs text-gray-700 font-medium">Citizenship_Pdf.png</span>
                            </div>
                            <select class="text-[11px] border border-gray-300 rounded p-1.5 text-orange-600 font-bold bg-orange-50 outline-none cursor-pointer focus:border-orange-400">
                                <option class="text-orange-600 font-bold">⏳ Under Review</option>
                                <option class="text-green-600 font-bold">✅ Approve</option>
                                <option class="text-red-600 font-bold">❌ Reject</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="uploadActionSection" class="flex justify-end w-full mt-auto">
                    <input type="file" id="studentFileInput" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx" class="hidden" onchange="handleFileSelection(this)">
                    
                    <button onclick="triggerFileInput()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md inline-flex items-center gap-2 shadow-sm transition-all duration-150">
                        <i class="fas fa-plus text-xs"></i>
                        <span class="text-xs">Upload Document</span>
                    </button>
                </div>

                <div id="remarksContent" class="hidden w-full">
                    <div class="bg-blue-50/50 border border-blue-100 rounded-lg p-3 mb-5 flex items-center justify-between gap-4 shadow-sm">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-xs text-gray-700 whitespace-nowrap">Assign Date:</span>
                            <input type="date" id="followupDate" onchange="autoAddDate(this.value)" class="border border-gray-300 rounded px-2.5 py-1 text-xs focus:ring-2 focus:ring-blue-500 outline-none shadow-sm bg-white">
                        </div>
                        <button onclick="toggleRemarkModal(true)" class="bg-blue-800 text-white px-5 py-1.5 rounded-md font-bold text-xs hover:bg-blue-900 transition flex items-center gap-1.5 shadow-md">
                            <i class="fas fa-plus-circle"></i> Add New Remark
                        </button>
                    </div>

                    <div id="dynamicRemarksList" class="space-y-3">
                        <div class="border border-gray-200 rounded p-3 bg-gray-50">
                            <p class="font-bold text-xs text-gray-800 mb-0.5">
                                Priya Thapa <span class="font-normal text-gray-400 text-[10px] italic ml-2">on 30th Jan 2026</span>
                            </p>
                            <p class="text-xs text-gray-600">Offer letter received from the VU</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="editProfileModal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-[850px] mx-4 overflow-hidden border border-gray-100 p-8">
            <div class="text-[#94a3b8] font-bold text-xs uppercase tracking-wider mb-5">Personal Information</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-5">
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-slate-700 mb-2">First Name</label>
                    <input type="text" id="inputFirstName" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:border-blue-600 outline-none text-slate-700" value="Sujata">
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-slate-700 mb-2">Middle Name</label>
                    <input type="text" id="inputMiddleName" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:border-blue-600 outline-none text-slate-700" value="">
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-slate-700 mb-2">Last Name</label>
                    <input type="text" id="inputLastName" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:border-blue-600 outline-none text-slate-700" value="Thapa">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-slate-700 mb-2">Phone Number</label>
                    <input type="text" id="inputPhone" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:border-blue-600 outline-none text-slate-700" value="9815145982">
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-slate-700 mb-2">Email Address</label>
                    <input type="email" id="inputEmail" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:border-blue-600 outline-none text-slate-700" value="sujatathapa05@gmail.com">
                </div>
            </div>

            <div class="text-[#94a3b8] font-bold text-xs uppercase tracking-wider mb-5">Study Preferences & Target</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="flex flex-col relative">
                    <label class="text-xs font-bold text-slate-700 mb-2">Preferred Country</label>
                    <select id="inputCountry" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:border-blue-600 outline-none bg-white appearance-none text-slate-700 pr-10">
                        <option selected>United Kingdom (UK)</option>
                        <option>USA</option>
                        <option>Canada</option>
                        <option>Australia</option>
                    </select>
                    <div class="absolute bottom-4 right-4 pointer-events-none text-slate-600 text-xs">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                <div class="flex flex-col relative">
                    <label class="text-xs font-bold text-slate-700 mb-2">Test Type</label>
                    <select id="inputTestType" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:border-blue-600 outline-none bg-white appearance-none text-slate-700 pr-10">
                        <option selected>IELTS</option>
                        <option>PTE</option>
                        <option>TOEFL</option>
                    </select>
                    <div class="absolute bottom-4 right-4 pointer-events-none text-slate-600 text-xs">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-slate-700 mb-2">Score</label>
                    <input type="text" id="inputScore" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:border-blue-600 outline-none text-slate-700" value="6.5">
                </div>
            </div>

            <div class="flex justify-end items-center gap-6 pt-4">
                <button type="button" onclick="toggleEditProfileModal(false)" class="text-sm font-semibold text-slate-500 hover:text-slate-800 transition">Cancel</button>
                <button type="button" onclick="saveProfileChanges()" class="bg-[#1e3a8a] text-white px-7 py-3 rounded-xl text-sm font-semibold hover:bg-blue-900 transition flex items-center gap-2 shadow-md">
                    <i class="fas fa-save text-xs"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <div id="remarkModal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-md mx-4 overflow-hidden border border-gray-200">
            <div class="bg-blue-800 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-base"><i class="fas fa-comment-alt mr-2"></i> Add Remark</h3>
                <button onclick="toggleRemarkModal(false)" class="text-white hover:text-gray-200 text-xl font-bold">&times;</button>
            </div>
            <div class="p-5">
                <label class="block text-xs font-bold text-gray-700 mb-2">Write Remark Details:</label>
                <textarea id="modalRemarkText" rows="4" class="w-full border border-gray-300 rounded-md p-3 text-xs focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Type here..."></textarea>
            </div>
            <div class="bg-gray-50 px-6 py-3 flex justify-end gap-3 border-t border-gray-200">
                <button onclick="toggleRemarkModal(false)" class="px-4 py-2 text-xs font-bold text-gray-600 hover:text-gray-800">Cancel</button>
                <button onclick="saveModalRemark()" class="bg-blue-700 text-white px-5 py-2 rounded font-bold text-xs hover:bg-blue-800 transition">Save Remark</button>
            </div>
        </div>
    </div>

    <script>
        // Tab system navigation logic
        function switchTab(tabName) {
            const docContent = document.getElementById('documentContent');
            const remContent = document.getElementById('remarksContent');
            const docTab = document.getElementById('docTab');
            const remTab = document.getElementById('remTab');
            const uploadBtn = document.getElementById('uploadActionSection');

            if (tabName === 'document') {
                docContent.classList.remove('hidden');
                uploadBtn.classList.remove('hidden');
                remContent.classList.add('hidden');
                docTab.classList.add('active-tab');
                remTab.classList.remove('active-tab');
            } else {
                docContent.classList.add('hidden');
                uploadBtn.classList.add('hidden');
                remContent.classList.remove('hidden');
                remTab.classList.add('active-tab');
                docTab.classList.remove('active-tab');
            }
        }

        // Toggle Edit Profile Modal
        function toggleEditProfileModal(show) {
            const modal = document.getElementById('editProfileModal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        // Save Edit Profile Details
        function saveProfileChanges() {
            const firstName = document.getElementById('inputFirstName').value.trim();
            const middleName = document.getElementById('inputMiddleName').value.trim();
            const lastName = document.getElementById('inputLastName').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const email = document.getElementById('inputEmail').value.trim();

            if (!firstName || !lastName || !phone || !email) {
                alert("Please fill all the required fields.");
                return;
            }

            const fullName = middleName ? `${firstName} ${middleName} ${lastName}` : `${firstName} ${lastName}`;

            document.getElementById('displayFullName').innerText = fullName;
            document.getElementById('displayPhone').innerText = phone;
            document.getElementById('displayEmail').innerText = email;

            toggleEditProfileModal(false);
        }

        // Trigger Hidden File Selector
        function triggerFileInput() {
            document.getElementById('studentFileInput').click();
        }

        // Handle Newly Uploaded File
        function handleFileSelection(inputElement) {
            if (inputElement.files.length === 0) return;
            
            const file = inputElement.files[0];
            const fileName = file.name;
            const fileExtension = fileName.split('.').pop().toLowerCase();
            
            const allowedExtensions = ['jpg', 'jpeg', 'png', 'pdf', 'doc', 'docx'];
            
            if (!allowedExtensions.includes(fileExtension)) {
                alert("यो फरम्याट सपोर्ट गर्दैन! कृपया JPG, PNG, PDF वा DOC फाइल मात्र अपलोड गर्नुहोला।");
                inputElement.value = '';
                return;
            }

            let iconClass = "fa-file-alt text-gray-500";
            if (['jpg', 'jpeg', 'png'].includes(fileExtension)) {
                iconClass = "fa-file-image text-blue-500";
            } else if (fileExtension === 'pdf') {
                iconClass = "fa-file-pdf text-red-500";
            } else if (['doc', 'docx'].includes(fileExtension)) {
                iconClass = "fa-file-word text-blue-700";
            }

            const fileListContainer = document.getElementById('fileList');

            const newFileHTML = `
                <div class="flex items-center justify-between border border-gray-200 p-3 rounded bg-white hover:bg-gray-50 transition new-row">
                    <div class="flex items-center gap-3">
                        <i class="fas ${iconClass} text-lg"></i>
                        <span class="text-xs text-gray-700 font-medium">${fileName}</span>
                    </div>
                    <select class="text-[11px] border border-gray-300 rounded p-1.5 text-orange-600 font-bold bg-orange-50 outline-none cursor-pointer focus:border-orange-400" onchange="updateDropdownColor(this)">
                        <option class="text-orange-600 font-bold">⏳ Under Review</option>
                        <option class="text-green-600 font-bold">✅ Approve</option>
                        <option class="text-red-600 font-bold">❌ Reject</option>
                    </select>
                </div>
            `;

            fileListContainer.insertAdjacentHTML('beforeend', newFileHTML);
            inputElement.value = '';
        }

        // Dynamically shift dropdown styling
        function updateDropdownColor(selectElement) {
            const value = selectElement.value;
            if(value.includes('Approve')) {
                selectElement.className = "text-[11px] border border-gray-300 rounded p-1.5 text-green-600 font-bold bg-green-50 outline-none cursor-pointer";
            } else if(value.includes('Reject')) {
                selectElement.className = "text-[11px] border border-gray-300 rounded p-1.5 text-red-600 font-bold bg-red-50 outline-none cursor-pointer";
            } else {
                selectElement.className = "text-[11px] border border-gray-300 rounded p-1.5 text-orange-600 font-bold bg-orange-50 outline-none cursor-pointer";
            }
        }

        // Toggle Remarks Popup
        function toggleRemarkModal(show) {
            const modal = document.getElementById('remarkModal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.getElementById('modalRemarkText').value = '';
            }
        }

        // Auto history entry for Date input inside remarks
        function autoAddDate(dateVal) {
            if(!dateVal) return;
            const list = document.getElementById('dynamicRemarksList');
            const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            const dateHTML = `
                <div class="border border-blue-100 rounded p-3 bg-blue-50/40 shadow-sm new-row">
                    <p class="font-bold text-xs text-gray-800 mb-0.5">
                        Priya Thapa <span class="font-normal text-gray-400 text-[10px] italic ml-2">on ${today}</span>
                    </p>
                    <p class="text-xs font-bold text-blue-700">Followup added successfully for ${dateVal}.</p>
                </div>
            `;
            list.insertAdjacentHTML('afterbegin', dateHTML);
        }

        // Save Remark Input Form values
        function saveModalRemark() {
            const textVal = document.getElementById('modalRemarkText').value;
            const list = document.getElementById('dynamicRemarksList');

            if (!textVal.trim()) {
                alert("Please enter remark text!");
                return;
            }

            const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            const remarkHTML = `
                <div class="border border-gray-200 rounded p-3 bg-white shadow-sm new-row border-l-4 border-l-blue-600">
                    <p class="font-bold text-xs text-gray-800 mb-0.5">
                        Priya Thapa <span class="font-normal text-gray-400 text-[10px] italic ml-2">on ${today}</span>
                    </p>
                    <p class="text-xs text-gray-600">${textVal}</p>
                </div>
            `;

            list.insertAdjacentHTML('afterbegin', remarkHTML);
            toggleRemarkModal(false);
        }
    </script>
</body>
</html>
