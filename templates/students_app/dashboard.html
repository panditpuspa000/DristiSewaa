{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - DristiSewa</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            display:flex;
            background:#f0f2f5;
            height:100vh;
            overflow:hidden;
        }

        .sidebar{
            width:280px;
            background:linear-gradient(180deg,#1e27cc 0%, #151b8d 100%);
            color:white;
            display:flex;
            flex-direction:column;
        }

        .user-profile{
            padding:40px 20px;
            text-align:center;
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        .nav-links{
            flex:1;
            padding:20px 0;
        }

        .nav-item{
            padding:15px 30px;
            display:flex;
            align-items:center;
            text-decoration:none;
            color:rgba(255,255,255,0.8);
        }

        .nav-item.active{
            background:#00d2ff;
            color:white;
        }

        .logout-btn{
            background:#ffb800;
            color:#000;
            padding:18px;
            text-align:center;
            text-decoration:none;
            font-weight:700;
        }

        .main-content{
            flex:1;
            overflow-y:auto;
        }

        .top-header{
            background:#fff;
            padding:15px 40px;
            display:flex;
            justify-content:flex-end;
            align-items:center;
        }

        .form-card{
            background:white;
            margin:30px auto;
            width:92%;
            max-width:1000px;
            padding:40px;
            border-radius:12px;
        }

        .form-title{
            font-size:22px;
            margin-bottom:30px;
            color:#1e27cc;
        }

        .section-header{
            margin:25px 0 15px;
            font-weight:600;
            color:#444;
            border-bottom:2px solid #eee;
            padding-bottom:8px;
        }

        .grid-row{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .field-group{
            display:flex;
            flex-direction:column;
        }

        input, select{
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
        }

        .error{
            border:2px solid red !important;
        }

        .footer-action{
            margin-top:40px;
            display:flex;
            justify-content:flex-end;
        }

        .next-btn{
            width:55px;
            height:55px;
            border-radius:50%;
            border:none;
            background:#1e27cc;
            color:white;
            font-size:20px;
            cursor:pointer;
        }

        .error-msg{
            color:red;
            font-size:13px;
            margin-top:10px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="user-profile">
        <i class="fa-solid fa-circle-user" style="font-size:60px;"></i>
        <p>Student Dashboard</p>
    </div>

    <div class="nav-links">

        <a href="{% url 'dashboard' %}" class="nav-item active">
            <i class="fa-solid fa-house"></i> Home
        </a>

        <a href="{% url 'upload_docs' %}" class="nav-item">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload Documents
        </a>

        <a href="{% url 'app_status' %}" class="nav-item">
            <i class="fa-solid fa-clock"></i> Status
        </a>

    </div>

    <a href="{% url 'home' %}" class="logout-btn">
        <i class="fa-solid fa-power-off"></i> Logout
    </a>

</div>

<!-- MAIN -->
<div class="main-content">

    <div class="top-header">
        <div>
            <strong>Hi, {{ request.user.first_name }}!</strong><br>
            <small>{{ request.user.email }}</small>
        </div>
    </div>

    <div class="form-card">

        <h2 class="form-title">Application Form</h2>

        <form id="appForm">

            <div class="section-header">Personal Information</div>

            <div class="grid-row">

                <div class="field-group">
                    <label>First Name</label>
                    <input type="text" value="{{ request.user.first_name }}" readonly>
                </div>

                <div class="field-group">
                    <label>Last Name</label>
                    <input type="text" value="{{ request.user.last_name }}" readonly>
                </div>

            </div>

            <div class="grid-row">

                <div class="field-group">
                    <label>Email</label>
                    <input type="text" value="{{ request.user.email }}" readonly>
                </div>

                <div class="field-group">
                    <label>Date of Birth</label>
                    <input type="date">
                </div>

            </div>

            <div class="section-header">Academic</div>

            <div class="grid-row">

                <div class="field-group">
                    <label>College Name</label>
                    <input type="text">
                </div>

                <div class="field-group">
                    <label>Passed Year (1990-2027)</label>
                    <input type="number" id="year" min="1990" max="2027">
                </div>

                <div class="field-group">
                    <label>GPA (0.0 - 4.0)</label>
                    <input type="number" id="gpa" step="0.01" min="0" max="4">
                </div>

            </div>

            <div class="section-header">English</div>

            <div class="grid-row">

                <div class="field-group">
                    <label>Test Type</label>
                    <select id="testType">
                        <option value="">Select</option>
                        <option value="IELTS">IELTS</option>
                        <option value="PTE">PTE</option>
                        <option value="TOEFL">TOEFL</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Score</label>
                    <input type="number" id="score">
                </div>

                <div class="field-group">
                    <label>Preferred Country</label>
                    <select>
                        <option>UK</option>
                        <option>USA</option>
                        <option>Canada</option>
                        <option>Australia</option>
                    </select>
                </div>

            </div>

            <p id="error" class="error-msg"></p>

            <div class="footer-action">
                <button type="button" class="next-btn" onclick="validateForm()">
                    <i class="fa-solid fa-angles-right"></i>
                </button>
            </div>

        </form>

    </div>

</div>

<script>
function validateForm(){

    let year = document.getElementById("year");
    let gpa = document.getElementById("gpa");
    let testType = document.getElementById("testType");
    let score = document.getElementById("score");
    let error = document.getElementById("error");

    error.innerText = "";

    let y = parseInt(year.value);
    let g = parseFloat(gpa.value);
    let s = parseFloat(score.value);
    let t = testType.value;

    // YEAR CHECK
    if(y < 1990 || y > 2027){
        error.innerText = "Passed year must be between 1990 and 2027";
        return;
    }

    // GPA CHECK
    if(g < 0 || g > 4){
        error.innerText = "GPA must be between 0.0 and 4.0";
        return;
    }

    // TEST TYPE VALIDATION
    if(t === ""){
        error.innerText = "Select English test type";
        return;
    }

    // SCORE VALIDATION
    if(t === "IELTS" && (s < 0 || s > 9)){
        error.innerText = "IELTS score must be 0 - 9";
        return;
    }

    if(t === "PTE" && (s < 10 || s > 90)){
        error.innerText = "PTE score must be 10 - 90";
        return;
    }

    if(t === "TOEFL" && (s < 0 || s > 120)){
        error.innerText = "TOEFL score must be 0 - 120";
        return;
    }

    // SUCCESS → redirect
    window.location.href = "{% url 'upload_docs' %}";
}
</script>

</body>
</html>
